name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, dom, xml, gd
          coverage: none
          tools: composer:v2

      - name: Lint plugin files
        run: for f in *.php classes/*.php tests/*.php; do php -l "$f"; done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin archive
        id: build
        run: echo "archive=$(scripts/build-package.sh dist)" >> "$GITHUB_OUTPUT"

      - name: Check archive layout
        run: |
          tar -tzf "${{ steps.build.outputs.archive }}"
          tar -tzf "${{ steps.build.outputs.archive }}" | grep -qx 'docxFontStripper/version.xml'

      - uses: actions/upload-artifact@v4
        with:
          name: docxFontStripper
          path: dist/*.tar.gz

      - name: Attach archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz --clobber --repo "${{ github.repository }}"
