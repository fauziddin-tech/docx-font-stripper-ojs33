name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, dom, xml, gd
          coverage: none
          tools: composer:v2

      - name: Lint plugin files
        run: for f in *.php classes/*.php tests/*.php; do php -l "$f"; done

      # The OJS 3.5 build needs PHP 8.2 or newer (OJS 3.5's own minimum)
      - name: Lint OJS 3.5 build
        if: matrix.php != '7.4' && matrix.php != '8.1'
        run: for f in ojs35/*.php ojs35/classes/*.php; do php -l "$f"; done

      - name: JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin archives
        id: build
        run: |
          echo "archive33=$(scripts/build-package.sh dist ojs33)" >> "$GITHUB_OUTPUT"
          echo "archive35=$(scripts/build-package.sh dist ojs35)" >> "$GITHUB_OUTPUT"

      - name: Check archive layout
        run: |
          a33="${{ steps.build.outputs.archive33 }}"
          a35="${{ steps.build.outputs.archive35 }}"
          tar -tzf "$a33"
          tar -tzf "$a35"
          for f in version.xml js/fileSizes.js classes/DocxFontStripper.inc.php; do
            tar -tzf "$a33" | grep -qx "docxFontStripper/$f"
            tar -tzf "$a35" | grep -qx "docxFontStripper/$f"
          done
          tar -tzf "$a33" | grep -qx 'docxFontStripper/DocxFontStripperPlugin.inc.php'
          tar -tzf "$a35" | grep -qx 'docxFontStripper/DocxFontStripperPlugin.php'
          tar -tzf "$a35" | grep -qx 'docxFontStripper/classes/FileSizeLookup.php'
          tar -tzf "$a35" | grep -qx 'docxFontStripper/locale/id/locale.po'

      - uses: actions/upload-artifact@v4
        with:
          name: docxFontStripper
          path: dist/*.tar.gz

      # A release made on GitHub (Releases > Draft a new release, with a new
      # tag) starts two runs of this workflow at the same time: one for the
      # release (event "release") and one for the new tag (event "push").
      # Only the release run attaches the archives; the tag run attaches them
      # only when it creates the release itself, i.e. for a tag pushed with
      # git. Releases created with GITHUB_TOKEN start no "release" run, so
      # the archives are never uploaded twice.
      - name: Check tag matches version.xml
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          version="$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' version.xml)"
          version35="$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' ojs35/version.xml)"
          if [ "$version35" != "2.${version#1.}" ]; then
            echo "ojs35/version.xml release $version35 must be 2.${version#1.} (version.xml is $version)" >&2
            exit 1
          fi
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match version.xml release $version" >&2
            exit 1
          fi

      - name: Attach archives to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz --clobber --repo "${{ github.repository }}"

      # Pushing a tag such as v1.6.0.0 with git creates the release (notes
      # from release-notes/<version>.md) with the archives attached.
      - name: Create release for pushed tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release-notes/${tag#v}.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists (made on GitHub); its own run attaches the archives."
            exit 0
          fi
          args=(--title "Docx Font Stripper ${tag#v}" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$tag" dist/*.tar.gz "${args[@]}" --repo "$GITHUB_REPOSITORY"
